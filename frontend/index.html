<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BugFlow Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 26px;
        }

        .header p {
            margin-top: 5px;
            color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .status {
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .status strong {
            display: block;
            font-size: 22px;
            margin-top: 5px;
        }

        .loading {
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 768px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>BugFlow Admin Dashboard</h1>
        <p>Software Issue Tracking & Resolution Platform</p>
    </header>

    <main class="container">

        <div class="cards">

            <div class="card">
                <h3>Total Issues</h3>
                <div class="number" id="totalIssues">-</div>
            </div>

            <div class="card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">-</div>
            </div>

            <div class="card">
                <h3>Total Sprints</h3>
                <div class="number" id="totalSprints">-</div>
            </div>

        </div>

        <section class="section">

            <h2>Issues by Status</h2>

            <div id="statusContainer" class="status-grid">
                <p class="loading">Loading analytics...</p>
            </div>

        </section>

        <section class="section">

            <h2>System Status</h2>

            <p id="systemStatus" class="loading">
                Checking BugFlow API...
            </p>

        </section>

    </main>

    <script src="dashboard.js"></script>

</body>
</html>
